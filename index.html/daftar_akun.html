<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar - Sakumu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rell="stylesheet">
    <link rel="stylesheet" href="/Style.css/daftar_akun.css">
</head>

<body>
    <main class="auth">
        <img class="logo" src="/Assets/onboarding5.png" alt="Logo Sakumu">
        <h1>Buat Akun Baru</h1>
        <p class="subtitle">Mulai Kelola Keuanganmu dengan mudah</p>

        <form class="card" id="registerForm" method="post" action="#" novalidate>
            <div class="field">
                <label for="username">ID User / Username</label>
                <div class="input-wrap">
                    <span class="icon" aria-hidden="true">👤</span>
                    <input type="text" id="username" name="username" placeholder="ID User" autocomplete="username"
                        minlength="4" maxlength="30" pattern="[A-Za-z0-9_.]+" required>
                </div>
                <p class="hint">Huruf, angka, titik, atau garis bawah.</p>
            </div>

            <div class="field">
                <label for="fullname">Nama Lengkap Pengguna</label>
                <div class="input-wrap">
                    <span class="icon" aria-hidden="true">➕</span>
                    <input type="text" id="fullname" name="fullname" placeholder="Masukkan Nama Lengkap Anda"
                        autocomplete="name" maxlength="100" required>
                </div>
            </div>

            <div class="field">
                <label for="email">Email Aktif</label>
                <div class="input-wrap">
                    <span class="icon" aria-hidden="true">✉️</span>
                    <input type="email" id="email" name="email" placeholder="Email Yang Aktif dan Valid"
                        autocomplete="email" maxlength="100" required>
                </div>
            </div>

            <div class="field">
                <label for="password">Kata Sandi</label>
                <div class="input-wrap">
                    <span class="icon" aria-hidden="true">🔒</span>
                    <input type="password" id="password" name="password" placeholder="Min.8 Karakter, gunakan simbol"
                        autocomplete="new-password" minlength="8" maxlength="64" required>
                    <button type="button" class="toggle" data-target="password"
                        aria-label="Tampilkan kata sandi">👁</button>
                </div>
            </div>

            <button type="submit" class="btn">Daftar Sekarang</button>
            <p class="error" id="error" role="alert"></p>
        </form>

        <p class="switch">Sudah Punya Akun? <a href="/index.html/login.html">Masuk</a></p>
    </main>

    <script src="js/auth.js"></script>
</body>

</html>
